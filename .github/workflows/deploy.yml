# Deploy to GitHub Pages
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Official source of the site base path (/<repo>/ for Project Pages).
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          set -euo pipefail
          echo "GITHUB_REPOSITORY=${GITHUB_REPOSITORY}"
          echo "BASE_PATH=${BASE_PATH}"
          npx tsc -b
          # Pass --base explicitly so asset URLs cannot fall back to "/".
          npx vite build --base "${BASE_PATH}"

      - name: Verify asset paths in dist/index.html
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          set -euo pipefail
          echo "---- dist/index.html ----"
          cat dist/index.html
          echo "-------------------------"
          if [ "${BASE_PATH}" = "/" ]; then
            grep -E 'src="/assets/[^"]+\.js"' dist/index.html
            grep -E 'href="/assets/[^"]+\.css"' dist/index.html
          else
            PREFIX="${BASE_PATH%/}"
            grep -E "src=\"${PREFIX}/assets/[^\"]+\\.js\"" dist/index.html
            grep -E "href=\"${PREFIX}/assets/[^\"]+\\.css\"" dist/index.html
          fi
          echo "Asset path check passed for BASE_PATH=${BASE_PATH}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
