# Deploy to GitHub Pages
name: Deploy GitHub Pages

on:
  push:
    # Default branch for this repo is master (also accept main).
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Official base_path for Project Pages: /<repository-name>/
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Resolve and build with correct base
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY##*/}"
          # Prefer configure-pages output; fall back to /<repo>/ for Project Pages.
          if [ -n "${PAGES_BASE_PATH:-}" ]; then
            BASE_PATH="${PAGES_BASE_PATH}"
          elif [ "${REPO}" = "${GITHUB_REPOSITORY_OWNER}.github.io" ]; then
            BASE_PATH="/"
          else
            BASE_PATH="/${REPO}/"
          fi
          # Normalize trailing slash (keep single "/")
          if [ "${BASE_PATH}" != "/" ]; then
            BASE_PATH="/${BASE_PATH#/}"
            BASE_PATH="${BASE_PATH%/}/"
          fi
          echo "GITHUB_REPOSITORY=${GITHUB_REPOSITORY}"
          echo "PAGES_BASE_PATH=${PAGES_BASE_PATH:-<empty>}"
          echo "BASE_PATH=${BASE_PATH}"
          export BASE_PATH
          npx tsc -b
          npx vite build --base "${BASE_PATH}"
          echo "BASE_PATH=${BASE_PATH}" >> "$GITHUB_ENV"

      - name: Verify asset paths in dist/index.html
        run: |
          set -euo pipefail
          echo "---- dist/index.html ----"
          cat dist/index.html
          echo "-------------------------"
          echo "Checking against BASE_PATH=${BASE_PATH}"
          if [ "${BASE_PATH}" = "/" ]; then
            grep -E 'src="/assets/[^"]+\.js"' dist/index.html
            grep -E 'href="/assets/[^"]+\.css"' dist/index.html
          else
            PREFIX="${BASE_PATH%/}"
            grep -E "src=\"${PREFIX}/assets/[^\"]+\\.js\"" dist/index.html
            grep -E "href=\"${PREFIX}/assets/[^\"]+\\.css\"" dist/index.html
            # Fail loudly if root /assets/ slipped in
            if grep -E 'src="/assets/' dist/index.html; then
              echo "ERROR: root /assets/ path found; base was not applied"
              exit 1
            fi
          fi
          echo "Asset path check passed for BASE_PATH=${BASE_PATH}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
